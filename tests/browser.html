<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tavreniq interaction checks</title><style>body{background:#111;color:#eee;font:16px/1.6 monospace;padding:24px}h1{font-size:24px}iframe{width:100%;height:900px;border:1px solid #555}li{padding:5px;color:#9cd4ad}.fail{color:#f99}#result{font-size:22px}</style></head><body><h1>Tavreniq interaction checks</h1><p id="result">Running…</p><ol id="log"></ol><iframe title="Dashboard under test" src="../dist/index.html"></iframe><script type="module">
const frame=document.querySelector('iframe'),log=document.querySelector('#log');let passed=0,failed=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function check(name,fn){try{await fn();log.insertAdjacentHTML('beforeend',`<li>PASS ${name}</li>`);passed++;}catch(e){log.insertAdjacentHTML('beforeend',`<li class="fail">FAIL ${name}: ${e.message}</li>`);failed++;}}
function assert(b,msg){if(!b)throw new Error(msg);}
await new Promise(r=>frame.addEventListener('load',r,{once:true}));await wait(500);
const w=frame.contentWindow,d=w.document,$=s=>d.querySelector(s);const load=()=>new Promise(r=>frame.addEventListener('load',r,{once:true}));
const storedPortfolio=w.localStorage.getItem('market-signal-portfolio-v1'),storedWatch=w.localStorage.getItem('market-signal-watch-v1');
try{
 await check('Chart and computed metrics render',()=>{assert($('#price-chart path').getAttribute('d').length>20,'No path');assert($('#mae').textContent.includes('$'),'No MAE');assert($('#accuracy').textContent.includes('%'),'No accuracy');});
 await check('Stock selection updates chart and current price',()=>{d.querySelector('[data-stock="AAPL"]').click();assert($('#chart-name').textContent.includes('Apple'),'Wrong asset');assert($('#current-price').textContent==='$232.84','Wrong price');});
 await check('Period control changes chart history',()=>{$('[data-range="5"]').click();assert($('#price-chart').getAttribute('aria-label').includes('5 synthetic'),'Wrong range');});
 await check('Forecast switch removes future interval',()=>{$('#forecast-toggle').click();assert(!$('#price-chart').getAttribute('aria-label').includes('Includes'),'Forecast stayed visible');$('#forecast-toggle').click();});
 await check('Watchlist toggles and restores asset',()=>{const before=$('#watchlist').textContent;$('#watch-button').click();assert($('#watchlist').textContent!==before,'Watch did not change');$('#watch-button').click();assert($('#watchlist').textContent===before,'Watch did not restore');});
 await check('Navigation and category filter work',async()=>{w.location.hash='markets';await wait(60);assert(!$('#markets').hidden,'Markets not visible');$('[data-filter="Macro"]').click();assert($('#all-markets').children.length===1,'Macro filter wrong');assert($('#all-markets').textContent.includes('Fed'),'Wrong macro market');});
 await check('Search has a usable empty state',()=>{$('#market-search').value='does-not-exist';$('#market-search').dispatchEvent(new w.Event('input',{bubbles:true}));assert(!$('#market-empty').hidden,'No empty message');$('#market-search').value='';$('#market-search').dispatchEvent(new w.Event('input',{bubbles:true}));$('[data-filter="All"]').click();});
 await check('Negative order is rejected without closing ticket',()=>{$('#all-markets [data-market="nvda200"][data-side="yes"]').click();$('#order-amount').value='-1';$('#trade-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));assert($('#trade-dialog').open,'Ticket closed');assert($('#order-error').textContent.length>5,'No validation message');});
 await check('Whole-share paper order updates portfolio',async()=>{$('#close-trade').click();w.location.hash='portfolio';await wait(60);$('#reset-button').click();w.location.hash='markets';await wait(60);$('#all-markets [data-market="nvda200"][data-side="yes"]').click();$('#order-amount').value='100';$('#order-amount').dispatchEvent(new w.Event('input',{bubbles:true}));assert($('#order-shares').textContent==='149 YES','Wrong shares');$('#trade-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));assert(!$('#trade-dialog').open,'Ticket still open');w.location.hash='portfolio';await wait(60);assert($('#portfolio-summary').textContent.includes('$9,900.17'),'Wrong balance');assert($('#positions').textContent.includes('149'),'Missing position');});
 await check('Reload preserves cash and order',async()=>{const ready=load();frame.contentWindow.location.reload();await ready;await wait(250);assert($('#portfolio-summary').textContent.includes('$9,900.17'),'Balance not persisted');assert($('#positions').textContent.includes('149'),'Trade not persisted');});
 await check('No overflow at this viewport',()=>assert(d.documentElement.scrollWidth<=w.innerWidth,'Horizontal document overflow'));
}finally{if(storedPortfolio===null)w.localStorage.removeItem('market-signal-portfolio-v1');else w.localStorage.setItem('market-signal-portfolio-v1',storedPortfolio);if(storedWatch===null)w.localStorage.removeItem('market-signal-watch-v1');else w.localStorage.setItem('market-signal-watch-v1',storedWatch);}
document.querySelector('#result').textContent=`${passed} passed · ${failed} failed`;document.title=`${failed?'FAIL':'PASS'} — ${passed} interaction checks`;
</script></body></html>
